<form [formGroup]="quoteForm" (ngSubmit)="onSubmit()">
  <ion-item>
    <ion-label position="stacked">Cita (Mín. 5 caracteres)</ion-label>
    <ion-input formControlName="texto" type="text" placeholder="Escriba la frase..."></ion-input>
  </ion-item>

  <ion-item>
    <ion-label position="stacked">Autor (Mín. 2 caracteres)</ion-label>
    <ion-input formControlName="autor" type="text" placeholder="Nombre del autor..."></ion-input>
  </ion-item>

  <ion-button expand="block" type="submit" [disabled]="quoteForm.invalid">
    AGREGAR
  </ion-button>
</form>
