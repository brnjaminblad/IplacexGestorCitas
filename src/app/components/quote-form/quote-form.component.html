<form [formGroup]="form" (ngSubmit)="submit()">

  <ion-item>
    <ion-label position="stacked">Quote</ion-label>
    <ion-textarea formControlName="text"></ion-textarea>
  </ion-item>

  <ion-item>
    <ion-label position="stacked">Author</ion-label>
    <ion-input formControlName="author"></ion-input>
  </ion-item>

  <!-- BOTÓN IMPORTANTE -->
  <ion-button type="submit" expand="block" [disabled]="form.invalid">
    Add +
  </ion-button>

</form>
