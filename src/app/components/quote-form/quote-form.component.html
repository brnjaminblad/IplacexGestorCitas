<ion-item>
  <ion-label position="stacked">Quote</ion-label>
  <ion-textarea
    [maxlength]="1024"
    formControlName="text">
  </ion-textarea>
</ion-item>

<ion-item>
  <ion-label position="stacked">Author</ion-label>
  <ion-input
    [maxlength]="80"
    formControlName="author">
  </ion-input>
</ion-item>

<ion-button expand="block" (click)="submit()">
  Add +
</ion-button>
