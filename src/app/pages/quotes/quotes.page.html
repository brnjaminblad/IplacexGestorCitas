<ion-content>

  <app-quote-form (add)="addQuote($event)"></app-quote-form>

  <ion-card *ngFor="let q of quoteDb.quotes">
    <ion-card-header>
      <ion-card-title>{{ q.text }}</ion-card-title>
      <ion-card-subtitle>{{ q.author }}</ion-card-subtitle>
    </ion-card-header>

    <ion-button color="danger" (click)="delete(q.id)">
      Eliminar
    </ion-button>
  </ion-card>

</ion-content>
